<!DOCTYPE HTML>
<html>
<head>
<title>繪圖功能</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
<link type="text/css" rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css" />
<style>
	body{
		background:#F5F3E5;
	}
	
	.screenCanvas {
		display:inline-block;
		border: solid 2px #6699CC;
	}
	
	.toolPainterA, .toolPainterB, .wordPainter{
		border: solid 1px #000;
		width: 22px;
		height: 22px;
		display:inline-block;
	}
	
	.toolPainterLine{
		border: solid 1px #000;
		width: 68px;
		height: 22px;
		display:inline-block;
	}
	
	.selectTool{
		background-color:#ACD6FF;
	}
	
	.selectedTool{
		background-color:#97CBFF;
	}	
</style>
<script>
	(function(window, undefined){
	 	var tools = new Object();
	 	
	 	window['$C'] = function(ctx){
	 		var ret = new PaintTools(ctx);
	 		ret.regist(drawLine);
	 		ret.regist(strokeRect);
			ret.regist(strokeCircle);
			ret.regist(drawText);
			ret.regist(drawArrow);
			ret.regist(drawStraightLine);
	 		return ret;
	 	}
	 	
		var PaintTools = function(_ctx){
	 		this.ctx = _ctx;
	 		this.drawType = '';
	 	};
	
	 	PaintTools.prototype.regist = function(tool){
	 		if(typeof tool.type !== 'undefined' && typeof tool.run !== 'undefined') {
	 			tools[tool.type] = tool;
	 		}
	 	};
	 	
	 	PaintTools.prototype.execute = function(){
	 		var args = [];
	 		for(var i=0; i<arguments.length; i++){
	 			args.push(arguments[i]);
	 		}
	 		if(typeof tools[this.drawType] !== 'undefined'){
	 			tools[this.drawType].run.apply(this, args);
	 		}
	 	};
	 	
	 	//畫筆
	 	var drawLine = {
	 		type: 'drawLine',
	 		run: function(x, y, x1, y1){
	 			this.ctx.beginPath();
	 			
	 			//讓線條兩端變圓
	 	        this.ctx.lineCap = "round";  
	 	     	//讓線條轉折處變圓
	 	        this.ctx.lineJoin = "round"; 
	 			
	 			this.ctx.moveTo(x,y);
	 			this.ctx.lineTo(x1,y1);
	 			this.ctx.stroke();
	 		}
	 	}
	 	
	 	//空心矩形
	 	var strokeRect = {
	 		type: 'strokeRect',
	 		run: function(x, y, x1, y1){
	 			this.ctx.beginPath();
	 			this.ctx.rect(x, y, x1-x, y1-y);
	 			this.ctx.closePath();
	 			this.ctx.stroke();
	 		}
	 	}
	 
	 	//空心圓
		var strokeCircle ={
	 		type: 'strokeCircle',
	 		run: function(x1, y1, x2, y2) {
	 			var radius = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
	 			this.ctx.beginPath();
	 			this.ctx.arc(x2, y2, radius, 0, 2 * Math.PI, true);
	 			this.ctx.closePath();
	 			this.ctx.stroke();
	 		}
	 	};
	 
	 	//文字
		var drawText = {
	 		type: 'drawText',
	 		run: function(text, size, underline, x, y) {
			    size = parseInt(size, 10);
				size = size - size/2 + 3;
				let metrics = this.ctx.measureText(text);
	 			this.ctx.textAlign = 'left';
	 			this.ctx.fillText(text, x, y, metrics.width);

				if(underline){
					this.ctx.strokeStyle = $("#fillStyle").val();
					this.ctx.lineWidth = 1;
					this.ctx.beginPath();
					this.ctx.moveTo(x,y + size);
					this.ctx.lineTo(x + metrics.width,y + size);
					this.ctx.closePath();
					this.ctx.stroke();
					this.ctx.strokeStyle = $("#strokeStyle").val();
					this.ctx.lineWidth = $("#lineWidth").val();
				}
	 		}
	 	};
	 	
	 	//箭頭
	 	var drawArrow = {
	 		type: 'drawArrow',
	 		run: function(x, y, x1, y1){
	 		    var theta = 30;
		        var headken = 15;
		        if($("#lineWidth").val() == '5')
		        	headken = 25;
		        else if($("#lineWidth").val() == '7')
		        	headken = 30;
		        var angle = Math.atan2(y - y1, x - x1) * 180 / Math.PI;
				var angle1 = (angle + theta) * Math.PI / 180;
				var angle2 = (angle - theta) * Math.PI / 180;
				var topX = headken * Math.cos(angle1);
				var topY = headken * Math.sin(angle1);
				var botX = headken * Math.cos(angle2);
				var botY = headken * Math.sin(angle2);
		        
	 			this.ctx.beginPath();
	 			var arrowX = x - x1;
				var arrowY = y - y1;
	 			this.ctx.moveTo(x,y);
	 			this.ctx.lineTo(x1,y1);
	 			arrowX = x1 + topX;
				arrowY = y1 + topY;
	 			this.ctx.moveTo(x1,y1);
	 			this.ctx.lineTo(arrowX,arrowY);
	 			arrowX = x1 + botX;
				arrowY = y1 + botY;
				this.ctx.moveTo(x1,y1);
	 			this.ctx.lineTo(arrowX,arrowY);
	 			this.ctx.closePath();
	 			this.ctx.stroke();
	 		}
	 	}
	 	
	 	//直線
	 	var drawStraightLine = {
	 		type: 'drawStraightLine',
	 		run: function(x, y, x1, y1){
	 			this.ctx.beginPath();
	 			this.ctx.moveTo(x,y);
	 			this.ctx.lineTo(x1,y1);
	 			this.ctx.closePath();
	 			this.ctx.stroke();
	 		}
	 	}
	 })(window);
	 
	$(function(){
		// 動態調整畫面高度（支援視窗縮放）
		function resizeScreen() {
			$(".screenCanvas").css('height', ($(window).height() - 20) + 'px');
		}
		resizeScreen();
		$(window).on('resize', resizeScreen);

		var canvas = $('#canvas');
		var context = canvas[0].getContext('2d');
		var draftCanvas = $('#draftCanvas');
		var draftContext = draftCanvas[0].getContext('2d');
		var drawing = false;
		var isEraser = false;
		var queue = new Array();
		var cPushArray = new Array();
		var start = new Array();
		var cStep = -1;
		var scale = 1;
		
		// 告訴瀏覽器：當手指在畫布上滑動時，不要觸發網頁的捲動或縮放
		draftCanvas[0].style.touchAction = 'none';
		
		// 判斷當前工具是否需要用到「透明草稿層」
		function isShapeTool(type) {
			return type === 'strokeRect' || type === 'strokeCircle' || type === 'drawArrow' || type === 'drawStraightLine';
		}

		// 套用無損視覺縮放（只調整 CSS 顯示大小，不更動底圖實際像素）
		function applyZoom() {
			var cssW = Math.round(canvas[0].width * scale);
			var cssH = Math.round(canvas[0].height * scale);
			canvas.css({ width: cssW + 'px', height: cssH + 'px' });
			draftCanvas.css({ width: cssW + 'px', height: cssH + 'px' });

			// 縮放時若裁切框正在顯示，先隱藏避免座標錯位
			if ($("#selectDiv").is(":visible")) {
				$("#selectDiv").hide();
				$("#x1").val("X");
			}
		}

		// 將指標事件座標換算回 Canvas 真實像素座標（支援視覺縮放與拖出邊界）
		function getCanvasPos(e) {
			var rect = draftCanvas[0].getBoundingClientRect();
			var scaleX = rect.width ? (draftCanvas[0].width / rect.width) : 1;
			var scaleY = rect.height ? (draftCanvas[0].height / rect.height) : 1;
			return {
				x: (e.clientX - rect.left) * scaleX,
				y: (e.clientY - rect.top) * scaleY
			};
		}

		// 1. 畫筆落下
		draftCanvas[0].addEventListener('pointerdown', function(e) {
			// 滑鼠只回應左鍵，避免右鍵誤畫
			if (e.pointerType === 'mouse' && e.button !== 0) return;

			e.preventDefault();
			var pos = getCanvasPos(e);

			if (!drawing && tool.drawType == 'drawText') {
				e.stopPropagation();
				tool.ctx = context;
				tool.ctx.textBaseline = 'middle';
				inputWord();
				drawing = true;
				start = [pos.x, pos.y];
				return;
			}
			
			if (!drawing && tool.drawType != 'drawText') {
				// 鎖定指標，拖出畫布邊界不斷筆
				try {
					draftCanvas[0].setPointerCapture(e.pointerId);
				} catch (err) {}

				draftCanvas[0].dataset.cursor = draftCanvas[0].style.cursor;
				draftCanvas[0].style.cursor = 'crosshair';
				drawing = true;
				queue = [];
				
				// 根據工具切換畫布
				if (isShapeTool(tool.drawType)) {
					tool.ctx = draftContext; // 形狀工具：畫在草稿層
				} else {
					tool.ctx = context;      // 鉛筆/橡皮擦：直接畫在主畫布
				}
				
				var pressureLine = $("#lineWidth").val() * (e.pointerType === 'pen' ? e.pressure * 2 : 1);
				tool.ctx.lineWidth = pressureLine;
				
				tool.execute(pos.x, pos.y, pos.x, pos.y);
				queue.push([pos.x, pos.y]);
			}
		});

		// 2. 畫筆移動
		draftCanvas[0].addEventListener('pointermove', function(e) {
			e.preventDefault();
			if (drawing && tool.drawType != 'drawText') {
				var old = queue.shift();
				if (!old) return;
				
				if (isShapeTool(tool.drawType)) {
					draftContext.clearRect(0, 0, draftCanvas[0].width, draftCanvas[0].height);
					queue.push(old);
				}
				
				var pos = getCanvasPos(e);
				var pressureLine = $("#lineWidth").val() * (e.pointerType === 'pen' ? e.pressure * 2 : 1);
				tool.ctx.lineWidth = pressureLine;
				
				tool.execute(old[0], old[1], pos.x, pos.y);
				
				if (tool.drawType == 'drawLine') {
					queue.push([pos.x, pos.y]);
				}
			}
		});

		// 3. 畫筆離開
		function endDrawing(e) {
			if (drawing && tool.drawType == 'drawText') {
				drawing = false;
			} else if (drawing && tool.drawType != 'drawText') {
				try {
					if (draftCanvas[0].hasPointerCapture && draftCanvas[0].hasPointerCapture(e.pointerId)) {
						draftCanvas[0].releasePointerCapture(e.pointerId);
					}
				} catch (err) {}

				draftCanvas[0].style.cursor = draftCanvas[0].dataset.cursor || 'default';
				var old = queue.shift();
				var pos = getCanvasPos(e);

				if (old) {
					if (isShapeTool(tool.drawType)) {
						draftContext.clearRect(0, 0, draftCanvas[0].width, draftCanvas[0].height);
					}
					tool.execute(old[0], old[1], pos.x, pos.y);
				}
				
				// 如果是草稿層，把最終結果印回主畫布
				if (isShapeTool(tool.drawType)) {
					context.drawImage(draftCanvas[0], 0, 0);
					draftContext.clearRect(0, 0, draftCanvas[0].width, draftCanvas[0].height);
					tool.ctx = context;
				}
				
				drawing = false;
				cPush();
			}
		}

		draftCanvas[0].addEventListener('pointerup', endDrawing);
		draftCanvas[0].addEventListener('pointercancel', endDrawing);
		
		var tool = $C(context);
		
		// 暫存畫布歷史紀錄
		function cPush() {
			cStep++;
		
			// 如果在復原的狀態下又做了新動作，捨棄後面的歷史紀錄
			if (cStep < cPushArray.length) {
				cPushArray.length = cStep;
			}
		
			// 存入當前真實像素的 ImageData
			cPushArray.push(context.getImageData(0, 0, canvas[0].width, canvas[0].height));
		
			// 限制最多記錄 10 步 (加上初始狀態，陣列長度維持在 11 以內)
			if (cPushArray.length > 11) {
				cPushArray.shift();
				cStep--;
			}
		
			// 更新按鈕狀態
			if (cStep > 0) {
				$("#undo").removeClass('selectedTool').attr('disabled', false);
			} else {
				$("#undo").addClass('selectedTool').attr('disabled', true);
			}
			$("#redo").addClass('selectedTool').attr('disabled', true);
		}

		// 還原歷史紀錄（自動同步不同尺寸：裁切、旋轉、加空白皆可 Undo/Redo）
		function restoreHistory(imgData) {
			$("#selectDiv").hide();
			$("#x1").val("X");

			if (canvas[0].width !== imgData.width || canvas[0].height !== imgData.height) {
				canvas.attr('width', imgData.width);
				canvas.attr('height', imgData.height);
				draftCanvas.attr('width', imgData.width);
				draftCanvas.attr('height', imgData.height);
				applyZoom();
				initPaint();
			}
			context.putImageData(imgData, 0, 0);
		}

		// 回到上一個動作
		function cUndo() {
			if (cStep > 0) {
				cStep--;
				restoreHistory(cPushArray[cStep]);
				
				$("#redo").removeClass('selectedTool').attr('disabled', false);
				if (cStep === 0) {
					$("#undo").addClass('selectedTool').attr('disabled', true);
				}
			}
		}

		// 回到下一個動作
		function cRedo() {
			if (cStep < cPushArray.length - 1) {
				cStep++;
				restoreHistory(cPushArray[cStep]);
				
				$("#undo").removeClass('selectedTool').attr('disabled', false);
				if (cStep === cPushArray.length - 1) {
					$("#redo").addClass('selectedTool').attr('disabled', true);
				}
			}
		}

		// 快捷鍵：Ctrl+Z 復原、Ctrl+Y / Ctrl+Shift+Z 重做
		$(document).on('keydown', function(e) {
			var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
			if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
			if ($('#canvasDialog').hasClass('ui-dialog-content') && $('#canvasDialog').dialog('isOpen')) return;

			if (e.ctrlKey || e.metaKey) {
				var key = (e.key || '').toLowerCase();
				if (key === 'z' && !e.shiftKey) {
					e.preventDefault();
					cUndo();
				} else if (key === 'y' || (key === 'z' && e.shiftKey)) {
					e.preventDefault();
					cRedo();
				}
			}
		});
		
		// 存檔作業
		function cSave(){
			// 顯示 base64 格式
			alert(canvas[0].toDataURL('image/jpeg'));
		}
		
		// 載入底圖
		function drawImage(pic) {
			if (!pic) return;

			var image = new Image();
			image.src = pic;
			$(image).on('load', function () {
				var rate = 1;
				var w1 = $(window).width() * 0.9;
				var h1 = $(window).height() * 0.9;
				var w2 = this.width;
				var h2 = this.height;
				if(w2 > w1 || h2 > h1){
					rate = w1 / w2;
					rate = rate > h1 / h2 ? h1 / h2 : rate;
				}
			
				var initW = Math.round(w2 * rate);
				var initH = Math.round(h2 * rate);

				canvas.attr('width', initW);
				canvas.attr('height', initH);
				draftCanvas.attr('width', initW);
				draftCanvas.attr('height', initH);
				applyZoom();

				// 先鋪白底，避免透明 PNG 轉存 JPEG 時背景變黑
				context.fillStyle = '#fff';
				context.fillRect(0, 0, initW, initH);
				context.drawImage(image, 0, 0, this.width, this.height, 0, 0, initW, initH);
				initPaint();
			
				cStep = -1;
				cPushArray = new Array();
				cPush();
			});    
		}
		
		$(".toolPainterA, .toolPainterB, .toolPainterLine").on('mouseenter', function(){
			$(this).addClass("selectTool");
		}).on('mouseleave', function(){  
			$(this).removeClass("selectTool");
		});
	   
	   // 初始化雙層畫布畫筆設定
	   function initPaint(){
	 		context.lineWidth = $("#lineWidth").val();
	 		context.strokeStyle = $("#strokeStyle").val();
			context.fillStyle = $("#fillStyle").val();
			context.lineCap = "round";
			context.lineJoin = "round";
			context.font = "normal 400 10pt Arial";
			tool.drawType = $("#drawtype").val();
			
			draftContext.lineWidth = $("#lineWidth").val();
			draftContext.strokeStyle = $("#strokeStyle").val();
			draftContext.fillStyle = $("#fillStyle").val();
			draftContext.lineCap = "round";
			draftContext.lineJoin = "round";
			draftContext.font = "normal 400 10pt Arial";
	   }
	   
	   $(".toolPainterA").on('click', function(){
	    	var id = $(this).attr('id');
	    	if(id == 'save')
	    		cSave();
	    	else if(id == 'undo')
	    		cUndo();
	    	else if(id == 'redo')
	    		cRedo();
	    	else if(id == 'space')
	    		cSpace();
	    	else if(id == 'rotateLeft')
	    		cRotate(-90);
	    	else if(id == 'rotateRight')
	    		cRotate(90);
	   });
	   
	   $(".toolPainterB").on('click', function(){
	      $(".toolPainterB").css('background-color', '#F5F3E5');
	      $(this).css('background-color', '#97CBFF');
	      var id = $(this).attr('id');
		  if('select,cut'.indexOf(id) == -1){
			$("#selectDiv").hide();
			$("#x1").val("X");
		  }
	      $("#strokeStyle").val($("#strokeStylebackup").val());
	      isEraser = false;

	      if(id == 'pencil')
	      	 $("#drawtype").val('drawLine');
	      else if(id == 'eraser'){
	      	 isEraser = true;
	      	 $("#drawtype").val('drawLine');
	      	 $("#strokeStylebackup").val($("#strokeStyle").val());
	      	 $("#strokeStyle").val('#fff');
	      }else if(id == 'rectangle')
	      	 $("#drawtype").val('strokeRect');
	      else if(id == 'ellipse')
	      	 $("#drawtype").val('strokeCircle');
	      else if(id == 'text')
	      	 $("#drawtype").val('drawText');
	      else if(id == 'arrow')
	      	 $("#drawtype").val('drawArrow');
		  else if(id == 'straightLine')
	      	 $("#drawtype").val('drawStraightLine');
		  else if(id == 'select')
			 cSelect();	
		  else if(id == 'cut')
			 cCut();
	      initPaint();
	   });
	   
	   $(".toolPainterLine").on('click', function(){
	      $(".toolPainterLine").css('background-color', '#F5F3E5');
	      $(this).css('background-color', '#97CBFF');
	      $("#lineWidth").val($(this).attr('value'));
	      initPaint();
	   });
	   
	   // 輸入文字功能
	   function inputWord(){
	   	  var opt = new Object();
		  opt.autoOpen = false;
		  opt.resizable = false;
		  opt.closeOnEscape = false;
		  opt.close = function(){ $(this).dialog("destroy"); };
		  opt.title = "請輸入文字";
		  opt.width = $(window).width() * 0.4;
		  opt.height = $(window).height() * 0.4;
		  opt.buttons = {  
			 "確定": function(){
			    endWord();
				$(this).dialog("destroy");
			 },
			 "關閉": function(){
			    $(this).dialog("destroy");                    
			 }
		  };
	   
		   var wordsize = '';
		   for(var i = 10; i <= 100; i++){
		      wordsize += '<option value="' + i + '" ' + (i==24?'selected':'') + '>' + i + '</option>';  
		   }
		   var content = '<table><tr><td>文字：</td><td><input type="text" id="wordinput" size="30"></td></tr>' + 
		      '<tr><td>字型：</td><td><select id="wordfontfamily"><option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option>' + 
		   	  '<option value="PMingLiU">新細明體</option><option value="DFKai-sb">標楷體</option></select></td></tr>' +
		   	  '<tr><td>字型大小：</td><td><select id="wordsize">' + wordsize + '</select></td></tr>' + 
		   	  '<tr><td>屬性：</td><td>' + 
		   	  '<span class="wordPainter" id="boldword" style="background-image: url(\'images/painter/bold.gif\');"></span>&nbsp;' + 
		   	  '<span class="wordPainter" id="italicword" style="background-image: url(\'images/painter/italic.gif\');"></span>&nbsp;' +
			  '<span class="wordPainter" id="underlineword" style="background-image: url(\'images/painter/underline.gif\');"></span>' +
		   	  '</td></tr></table>';
		   $("#canvasDialog").empty().append(content).dialog(opt).dialog("open");
		   	
		   $(".wordPainter").on('mouseenter', function(){
			  $(this).addClass("selectTool");
		   }).on('mouseleave', function(){  
			  $(this).removeClass("selectTool");
		   }).on('click', function(){
		   	  $(this).toggleClass("selectedTool");
		   });
	   }
	   
	   // 寫入文字
	   function endWord(){
	   		var wordText = ($("#wordinput").val() || "").trim();
	   		if (wordText !== "") {
		   		var fontstyle = ($("#italicword").hasClass("selectedTool")?'italic':'normal') + ' ' + 
		   			($("#boldword").hasClass("selectedTool")?'700':'400') + ' ' + 
		   			$("#wordsize").val() + 'pt ' + $("#wordfontfamily").val();
		   		tool.ctx = context;
		   		context.font = fontstyle;
		 		tool.execute(wordText, $("#wordsize").val(), $("#underlineword").hasClass("selectedTool"), start[0], start[1]);
				cPush();
	   		}
			start = new Array();
			drawing = false;
	   }
	   
	   // 增加畫布空白長度
		function cSpace(){
			var opt = new Object();
			opt.autoOpen = false;
			opt.resizable = false;
			opt.closeOnEscape = false;
			opt.close = function(){ $(this).dialog("destroy"); };
			opt.title = "請輸入空白區塊長度";
			opt.width = $(window).width() * 0.3;
			opt.height = $(window).height() * 0.2;
			opt.buttons = {  
				"確定": function(){
					var rawVal = ($("#spacelength").val() || "").trim();
					var addLen = parseInt(rawVal, 10);
					if (rawVal === "" || isNaN(addLen) || addLen <= 0) {
						alert('請輸入大於 0 的數值');
						return;
					}

					var tmp = context.getImageData(0, 0, canvas[0].width, canvas[0].height);
					var newHeight = canvas[0].height + addLen;

					canvas.attr('height', newHeight);
					draftCanvas.attr('height', newHeight);
					applyZoom();

					context.clearRect(0, 0, canvas[0].width, newHeight);
					context.fillStyle = '#fff';
					context.fillRect(0, 0, canvas[0].width, newHeight);
					context.putImageData(tmp, 0, 0);

					initPaint();
					cPush();
					$(this).dialog("destroy");
				},
				"關閉": function(){
					$(this).dialog("destroy");                    
				}
			};
		   
			var content = '<table><tr><td>像素：</td><td><input type="text" id="spacelength" value="100" maxlength="4" size="10"></td></tr></table>';
			$("#canvasDialog").empty().append(content).dialog(opt).dialog("open");
		}
	
	   $("#colorPickerA").on("input change", function(){
	      var color = $(this).val(); // 直接取得 #RRGGBB 格式
	      $("#strokeStyle").val(color);
	      $("#strokeStylebackup").val(color);
	      // 橡皮擦模式下改選顏色，自動切回鉛筆避免狀態衝突

		max: 250,
		step: 25,
		slide: function(event, ui) {
			$("#amount").text(ui.value + '%');
			scale = ui.value / 100;
			applyZoom();
		}
	  });
	  
	  // 同步計算裁切框座標（相容任意縮放倍率）
	  function updateSelectCoords() {
			var selOffset = $('#selectDiv').offset();
			var x1 = selOffset.left;
			var y1 = selOffset.top;
			var x2 = x1 + $('#selectDiv').width();
			var y2 = y1 + $('#selectDiv').height();

			var cOffset = canvas.offset();
			var cx1 = cOffset.left;
			var cy1 = cOffset.top;
			var cx2 = cx1 + canvas.width();
			var cy2 = cy1 + canvas.height();

			if (cx2 <= x1 || cy2 <= y1 || x2 <= cx1 || y2 <= cy1) {
				$("#x1").val("X");
				return;
			}

			$("#x1").val(Math.max(x1, cx1));
			$("#y1").val(Math.max(y1, cy1));
			$("#x2").val(Math.min(x2, cx2));
			$("#y2").val(Math.min(y2, cy2));
	  }

	  $("#selectDiv")
			.resizable({ stop: updateSelectCoords })
			.draggable({ stop: updateSelectCoords })
			.on('mouseup', updateSelectCoords);

	  function cSelect(){
			var dispW = canvas.width();
			var dispH = canvas.height();
			var boxW = Math.min(100, dispW);
			var boxH = Math.min(100, dispH);
			var left = Math.max(0, Math.round(dispW / 2 - boxW / 2));
			var top = Math.max(0, Math.round(dispH / 2 - boxH / 2));

			$("#selectDiv").show().css({
				width: boxW + 'px',
				height: boxH + 'px',
				left: left + 'px',
				top: top + 'px'
			});
			updateSelectCoords();
		}
	   
	   function cCut(){
			if($("#x1").val() != 'X'){
				var x = confirm('是否確定要將圖片進行裁切？');
				if(x){
					var cOffset = canvas.offset();
					var ratioX = canvas.width() ? (canvas[0].width / canvas.width()) : 1;
					var ratioY = canvas.height() ? (canvas[0].height / canvas.height()) : 1;

					var x1 = Math.round((parseFloat($("#x1").val()) - cOffset.left) * ratioX);
					var y1 = Math.round((parseFloat($("#y1").val()) - cOffset.top) * ratioY);
					var x2 = Math.round((parseFloat($("#x2").val()) - cOffset.left) * ratioX);
					var y2 = Math.round((parseFloat($("#y2").val()) - cOffset.top) * ratioY);

					// 邊界夾緊避免超出實際像素範圍
					x1 = Math.max(0, Math.min(x1, canvas[0].width));
					y1 = Math.max(0, Math.min(y1, canvas[0].height));
					x2 = Math.max(0, Math.min(x2, canvas[0].width));
					y2 = Math.max(0, Math.min(y2, canvas[0].height));
					
					var newWidth = x2 - x1;
					var newHeight = y2 - y1;
					if (newWidth <= 0 || newHeight <= 0) {
						alert('裁切範圍無效，請重新選取');
						return;
					}

					var tmp = context.getImageData(x1, y1, newWidth, newHeight);

					canvas.attr('width', newWidth);
					canvas.attr('height', newHeight);
					draftCanvas.attr('width', newWidth);
					draftCanvas.attr('height', newHeight);
					applyZoom();

					// 將裁切後的影像貼回主畫布
					context.putImageData(tmp, 0, 0);

					// 恢復 UI 狀態
					isEraser = false;
					$(".toolPainterB").css('background-color', '#F5F3E5');
					$("#pencil").css('background-color', '#97CBFF');
					$("#drawtype").val('drawLine');
					
					initPaint();
					
					// 保留歷史紀錄，讓裁切也能 Undo / Redo
					cPush();
					
					$("#x1").val('X');
					$("#selectDiv").hide();
				}
			} else {
				alert('請選取裁切範圍');
			}
		}

		// 旋轉畫布 (degree: -90 為向左旋轉90度，90 為向右旋轉90度)
		function cRotate(degree) {
			$("#selectDiv").hide();
			$("#x1").val("X");

			var oldW = canvas[0].width;
			var oldH = canvas[0].height;
			if (oldW === 0 || oldH === 0) return;

			var tempCanvas = document.createElement('canvas');
			tempCanvas.width = oldW;
			tempCanvas.height = oldH;
			tempCanvas.getContext('2d').drawImage(canvas[0], 0, 0);

			var newW = oldH;
			var newH = oldW;

			canvas.attr('width', newW);
			canvas.attr('height', newH);
			draftCanvas.attr('width', newW);
			draftCanvas.attr('height', newH);
			applyZoom();

			context.save();
			context.fillStyle = '#fff';
			context.fillRect(0, 0, newW, newH);
			context.translate(newW / 2, newH / 2);
			context.rotate(degree * Math.PI / 180);
			context.drawImage(tempCanvas, -oldW / 2, -oldH / 2);
			context.restore();

			initPaint();
			cPush();
		}

</script>
